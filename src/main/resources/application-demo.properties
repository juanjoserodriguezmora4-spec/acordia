# =====================================================================
#  Perfil "demo": arranca sin instalar MySQL (usa H2, una base de datos en un archivo).
#  Para usarlo en NetBeans: clic derecho al proyecto > Properties > Run > VM Options:
#      -Dspring.profiles.active=demo
# =====================================================================
spring.datasource.url=jdbc:h2:file:./datos/acordia-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
