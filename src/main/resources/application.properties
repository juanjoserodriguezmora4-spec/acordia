# =====================================================================
#  ACORDIA - configuración principal (MySQL)
# =====================================================================

server.port=8080

# ---------- Base de datos MySQL ----------
# La base "acordia" se crea sola la primera vez (createDatabaseIfNotExist=true).
# rewriteBatchedStatements=true hace que la importación de Chordonomicon sea mucho más rápida.
spring.datasource.url=jdbc:mysql://localhost:3306/acordia?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&rewriteBatchedStatements=true&characterEncoding=UTF-8
spring.datasource.username=root
# En XAMPP la clave de root suele estar vacía. Si pusiste una, escríbela aquí.
spring.datasource.password=

# Hibernate crea y actualiza las tablas solo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100

# ---------- Archivos de audio ----------
# Carpeta donde se guardan los MP3 subidos (se crea sola).
acordia.audio.carpeta=./audios
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=41MB

# ---------- Spotify (opcional) ----------
# Crea una app en https://developer.spotify.com/dashboard (el dueño debe tener Spotify Premium)
# y copia aquí el Client ID y el Client Secret. Si los dejas vacíos, la búsqueda por nombre se desactiva
# y la página sigue funcionando con la detección automática.
spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

# ---------- Importar Chordonomicon (opcional) ----------
# 1. Descarga chordonomicon.csv de https://huggingface.co/datasets/ailsntua/Chordonomicon
# 2. Escribe aquí la ruta del archivo, por ejemplo C:/datos/chordonomicon.csv
# 3. Ejecuta el proyecto una vez. Cuando termine, puedes dejar esta línea vacía otra vez.
acordia.importar.csv=
# 0 = todas las canciones. Pon por ejemplo 50000 para una prueba rápida.
acordia.importar.limite=0
# true = borra lo que haya y vuelve a importar.
acordia.importar.reemplazar=false

# ---------- Varios ----------
spring.jackson.serialization.write-dates-as-timestamps=false
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# ---------- Análisis con IA (opcional) ----------
# Servicio en Python de la carpeta ia/ (Beat This! + BTC). Se abre con ia/iniciar-ia.bat.
# Si no está encendido, Acordia usa el analizador del navegador como siempre.
acordia.ia.url=http://127.0.0.1:5000
